<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Dieta — Entrar</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="wrap" style="max-width:420px">
    <div class="brand"><span class="dot"></span> Minha Dieta</div>
    <p class="subtitle">Gestão de dieta para perda de peso com IA</p>

    <div class="card center">
      <h2>Entrar</h2>
      <p class="hint">Use sua conta Google para acessar.</p>

      <div style="height:8px"></div>
      <button id="btnGoogle" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Entrar com Google
      </button>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from "/static/js/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const $ = (id) => document.getElementById(id);

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "/app";
    });

    $("btnGoogle").onclick = async () => {
      const msg = $("msg");
      msg.className = "msg";
      msg.textContent = "";
      try {
        await signInWithPopup(auth, provider);
        // redireciona via onAuthStateChanged
      } catch (e) {
        msg.className = "msg err";
        msg.textContent = traduzErro(e.code || e.message);
      }
    };

    function traduzErro(code) {
      const m = {
        "auth/popup-closed-by-user": "Janela fechada antes de concluir o login.",
        "auth/popup-blocked": "O navegador bloqueou o popup. Libere e tente de novo.",
        "auth/unauthorized-domain": "Este domínio não está autorizado no Firebase.",
        "auth/operation-not-allowed": "Login com Google não está ativado no Firebase.",
      };
      return m[code] || ("Erro: " + code);
    }
  </script>
</body>
</html>
