<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Dieta — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div style="min-height:100vh; display:grid; place-items:center; padding:32px 20px 100px;">
    <div class="rise" style="width:100%; max-width:392px;">
      <div style="display:flex; align-items:center; gap:10px; justify-content:center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14735A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v9l6 3"></path></svg>
        <div class="serif" style="font-size:30px;">Minha Dieta</div>
      </div>
      <p style="margin:14px 0 0; text-align:center; font-size:15px; line-height:1.6; color:var(--muted);">
        Sua bioimpedância e sua rotina viram um plano alimentar sob medida — com um toque no Telegram na hora de cada refeição.
      </p>

      <div class="card" style="margin-top:30px; padding:30px 26px 24px; box-shadow:var(--shadow-md);">
        <div class="serif" style="font-size:22px;">Entrar</div>
        <div style="margin-top:4px; font-size:13.5px; color:var(--muted2);">Use sua conta Google para acessar.</div>

        <button id="btnGoogle" class="btn-google" style="margin-top:20px;">
          <span class="gicon"></span>
          Entrar com Google
        </button>
        <div id="msg" class="msg" style="text-align:center;"></div>

        <div style="margin-top:20px; padding-top:18px; border-top:1px solid var(--line); display:flex; gap:20px; justify-content:center; font-size:12px; color:var(--muted3);">
          <span style="display:flex; align-items:center; gap:6px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
            Dados privados
          </span>
          <span style="display:flex; align-items:center; gap:6px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"></path></svg>
            Plano por IA
          </span>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from "/static/js/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const $ = (id) => document.getElementById(id);

    onAuthStateChanged(auth, (user) => { if (user) window.location.href = "/app"; });

    $("btnGoogle").onclick = async () => {
      const msg = $("msg"); msg.className = "msg"; msg.textContent = "";
      try { await signInWithPopup(auth, provider); }
      catch (e) { msg.className = "msg err"; msg.textContent = traduzErro(e.code || e.message); }
    };

    function traduzErro(code) {
      const m = {
        "auth/popup-closed-by-user": "Janela fechada antes de concluir o login.",
        "auth/popup-blocked": "O navegador bloqueou o popup. Libere e tente de novo.",
        "auth/unauthorized-domain": "Este domínio não está autorizado no Firebase.",
        "auth/operation-not-allowed": "Login com Google não está ativado no Firebase.",
      };
      return m[code] || ("Erro: " + code);
    }
  </script>
</body>
</html>
