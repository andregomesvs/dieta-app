# Deploy no Render — um único Web Service (Flask serve API + frontend).
# O Render lê este arquivo automaticamente (Blueprint).
services:
  - type: web
    name: minha-dieta
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # defina no painel (Secret)
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
      - key: FIREBASE_PROJECT_ID
        value: calendar-190c7
      - key: TELEGRAM_BOT_TOKEN
        sync: false            # token do @BotFather (defina no painel)
      - key: CRON_SECRET
        generateValue: true    # segredo que protege /cron/send-reminders
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: PYTHON_VERSION
        value: "3.12.4"
