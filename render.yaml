# Deploy no Render — um único Web Service (Flask serve API + frontend).
# O Render lê este arquivo automaticamente (Blueprint).
services:
  - type: web
    name: minha-dieta
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false            # defina no painel (Secret)
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
      - key: PYTHON_VERSION
        value: "3.12.4"
