# Deploy no Render — um único Web Service (Flask serve API + frontend).
# O Render lê este arquivo automaticamente (Blueprint).
services:
  - type: web
    name: minha-dieta
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # --threads 8: atende várias requisições ao mesmo tempo. Sem isso, uma chamada
    # lenta ao Gemini (ex.: "Estimar") trava o worker e o "Salvar" fica na fila.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # defina no painel (Secret)
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
      - key: FIREBASE_PROJECT_ID
        value: calendar-190c7
      - key: TELEGRAM_BOT_TOKEN
        sync: false            # token do @BotFather (defina no painel)
      - key: TELEGRAM_BOT_USERNAME
        value: minhadietazbot  # sem o @, usado no link de conexão
      - key: CRON_SECRET
        generateValue: true    # segredo que protege /cron/send-reminders
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: PYTHON_VERSION
        value: "3.12.4"
